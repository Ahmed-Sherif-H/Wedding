<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Maryam &amp; Ahmed — Mini Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Maryam &amp; Ahmed</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function setProgress(pct) {
        document.querySelector("#unity-progress-bar-full").style.width = (100 * pct) + "%";
      }

      function isPlainJs(bytes) {
        var head = new TextDecoder().decode(bytes.subarray(0, 48));
        return head.indexOf("unityFramework") !== -1 || /^\s*(var|let|const|function|\(|\/)/.test(head);
      }

      function isPlainWasm(bytes) {
        return bytes.length >= 4 && bytes[0] === 0 && bytes[1] === 97 && bytes[2] === 115 && bytes[3] === 109;
      }

      function isPlainData(bytes) {
        return new TextDecoder().decode(bytes.subarray(0, 16)).indexOf("UnityWebData1.0") === 0;
      }

      function isGzip(bytes) {
        return bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      }

      // Hosts like Cloudflare often omit Content-Encoding for precompressed Unity files.
      // Use gzip (not brotli): Safari's DecompressionStream supports gzip but not 'br'.
      async function loadUnityAsset(url, kind) {
        var response = await fetch(url);
        if (!response.ok) throw new Error("Failed to download " + url + " (" + response.status + ")");
        var buffer = await response.arrayBuffer();
        var bytes = new Uint8Array(buffer);
        var plain =
          kind === "js" ? isPlainJs(bytes) :
          kind === "wasm" ? isPlainWasm(bytes) :
          isPlainData(bytes);

        if (!plain) {
          if (!isGzip(bytes)) {
            throw new Error("Unexpected format for " + url + ". Expected gzip-compressed Unity asset.");
          }
          if (typeof DecompressionStream === "undefined") {
            throw new Error("This browser cannot decompress the game files. Please update Chrome/Edge/Firefox/Safari.");
          }
          buffer = await new Response(
            new Blob([buffer]).stream().pipeThrough(new DecompressionStream("gzip"))
          ).arrayBuffer();
        }

        var type =
          kind === "js" ? "application/javascript" :
          kind === "wasm" ? "application/wasm" :
          "application/octet-stream";
        return URL.createObjectURL(new Blob([buffer], { type: type }));
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/newbuild1.0.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/newbuild1.0.data.gz",
        frameworkUrl: buildUrl + "/newbuild1.0.framework.js.gz",
        codeUrl: buildUrl + "/newbuild1.0.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      canvas.style.width = "100%";
      canvas.style.height = "100%";
      document.querySelector("#unity-loading-bar").style.display = "block";
      setProgress(0.02);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        Promise.all([
          loadUnityAsset(config.dataUrl, "data").then(function (url) {
            setProgress(0.2);
            return url;
          }),
          loadUnityAsset(config.frameworkUrl, "js").then(function (url) {
            setProgress(0.28);
            return url;
          }),
          loadUnityAsset(config.codeUrl, "wasm").then(function (url) {
            setProgress(0.35);
            return url;
          }),
        ]).then(function (urls) {
          config.dataUrl = urls[0];
          config.frameworkUrl = urls[1];
          config.codeUrl = urls[2];

          return createUnityInstance(canvas, config, function (progress) {
            setProgress(0.35 + 0.65 * progress);
          });
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          console.error(message);
          unityShowBanner(String(message), "error");
          alert(message);
        });
      };
      script.onerror = function () {
        var msg = "Unable to load the Unity loader script.";
        unityShowBanner(msg, "error");
        alert(msg);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
